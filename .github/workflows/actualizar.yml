name: Actualizar tienda desde Google Sheets
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-tienda
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow reportlab
      - run: python herramientas/sincronizar.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SITIO: ${{ vars.SITIO || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - name: Guardar cambios
        run: |
          git config user.name "tienda-bot"
          git config user.email "tienda-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Actualización automática desde Google Sheets" && git push)
